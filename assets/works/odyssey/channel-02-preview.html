  <head><base href="https://annt154.github.io/assignment3/"><style>* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* base body styling */
body {
  background: #f5f5dc;
  padding: 20px;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 1400px;
  margin: 0 auto;
  background: rgb(255, 246, 246);
  padding: 30px;
  border-radius: 15px;
}

/* Title styling */
h1 {
  text-align: center;
  color: #ff69b4;
  margin-bottom: 30px;
}

/* Layout */
.game-layout {
  display: flex;
  gap: 30px;
  justify-content: center;
}

/* This is for the side pannels included items*/
.side {
  width: 350px;
}

/* styling the container for each item category */
.group {
  margin-bottom: 23px; /* space in between groups */
}

/* styling the group title, so for each group/catagory of clothes, there gonna be a title so the player will know what is that and maybe not redrag again. */
.group-title {
  font-size: 12px;
  color: #000000;
  text-transform: uppercase;
  margin-bottom: 10px;
  letter-spacing: 1px;
}

/* Grid layout for items within each group */
.items {
  display: flex;
  grid-template-columns: repeat(4, 1fr); /* 4 cột */
  gap: 10px;
}

/* Each draggable item container/box styling */
.item {
  border: 1px;
  border-radius: 8px;
  cursor: grab;
  transition: all 0.2s;
}

/* Hover effect so when hovering to a particular item on the side bar, the size gonna change so enhancing interaction experience */
.item:hover {
  transform: scale(1.1);
  border-color: #ff69b4;
  box-shadow: 0 2px 8px rgba(255, 105, 180, 0.3);
}

/* Visual feedback when dragging */
.item:active {
  cursor: grabbing;
}

/* styling the image inside the item container */
.item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  pointer-events: none;
}

/* Canvas/ droping item area */
.canvas {
  width: 500px;
  height: 600px;
  background: #fffaf0;
  border: 2px solid #ffb6c1;
  border-radius: 15px;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* main figure */
.character-main {
  max-width: 80%;
  max-height: 90%;
  position: absolute;
  z-index: 0; /* set to 0 to make sure it always laying underneath all of the items */
  pointer-events: none; /* Does not block drag & drop events on the canvas */
}

/* Dropped image container on the canvas */
.dropped-img {
  position: absolute;
  cursor: move;
  border: 2px solid transparent;
  transition: border 0.2s;
}

/* Hover effect on dropped items, so when hover to a particular item display on the canvas/dropped items, it gonna show boder */
.dropped-img:hover {
  border-color: #ff69b4;
}

/* Image inside the dropped container */
.dropped-img img {
  width: 100%;
  height: 100%;
  pointer-events: none;
}
/* X button */
.dropped-img .remove {
  position: absolute;
  top: -10px;
  right: -10px;
  background: red;
  color: white;
  border: none;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 14px;
  font-weight: bold;
  display: none;
}

/* styling the X button on the side pannels */
.item {
  position: relative; /* Cần có để đặt nút X */
}

.item .remove-item {
  position: absolute;
  top: -8px;
  right: -8px;
  width: 22px;
  height: 22px;
  background: linear-gradient(135deg, #ff4757 0%, #ff6b81 100%);
  color: white;
  border: 2px solid white;
  border-radius: 50%;
  cursor: pointer;
  font-size: 12px;
  font-weight: bold;
  display: none; /* hide the default template */
  align-items: center;
  justify-content: center;
  box-shadow: 0 2px 8px rgba(255, 71, 87, 0.4);
  z-index: 20; /* Ensure it's on top */
  transition: all 0.2s;
}

/* Display the 'X' button only when the item has been used */
.item.used .remove-item {
  display: flex;
}

.item.used {
  opacity: 0.5; /* lower the opacity of used items like marking it as used */
  position: relative;
}

/* Hover effect for the X button */
.remove-item:hover {
  transform: scale(1.2) rotate(90deg);
  background: #ff1744;
}

/* General styling for Back and Reset buttons */
.btn {
  background: linear-gradient(135deg, #ff6b9d 0%, #ffa8c5 100%);
  border: 3px solid white;
  border-radius: 50%;
  padding: 10px; /* spacing around the img */
}

.btn:hover {
  background: #ff1493;
  /*  styling when hovering these buttons */
}

/* Music button styling */
.music-btn {
  position: fixed;
  top: 20px;
  right: 20px;
  width: 70px;
  height: 70px;
  background: linear-gradient(135deg, #ff6b9d 0%, #ffa8c5 100%);
  border: 3px solid white;
  border-radius: 50%;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(255, 107, 157, 0.4);
  transition: all 0.3s;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px; /* spacing around the img */
}

/* Image inside the music button */
.music-btn img {
  width: 100%;
  height: 100%;
  object-fit: contain; /* keep the og size of the imgs */
  pointer-events: none;
}

/* styling hover and active effects for the music button */
.music-btn:hover {
  transform: scale(1.1) rotate(5deg);
  box-shadow: 0 6px 20px rgba(255, 107, 157, 0.6);
}

.music-btn:active {
  transform: scale(0.95);
}

/* styling when the music is muted */
.music-btn.muted {
  background: linear-gradient(135deg, #999 0%, #ccc 100%);
  opacity: 0.7;
}
